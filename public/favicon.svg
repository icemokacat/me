<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9c51d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6b41a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)" stroke="#2c2c2c" stroke-width="2"/>
  
  <!-- Portfolio briefcase icon -->
  <g fill="#2c2c2c">
    <!-- Briefcase body -->
    <rect x="7" y="14" width="18" height="11" rx="2" ry="2"/>
    <!-- Briefcase handle -->
    <rect x="11" y="11" width="10" height="3" rx="1" ry="1" fill="none" stroke="#2c2c2c" stroke-width="2"/>
    <!-- Briefcase lock -->
    <circle cx="16" cy="19" r="1.5"/>
    <rect x="15" y="20" width="2" height="2"/>
  </g>
</svg>